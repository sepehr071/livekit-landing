<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-Chat-Assistent</title>
    <link rel="stylesheet" href="/static/chat/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Main Content Area -->
        <div class="main-area">
            <!-- Connection Status (Top) -->
            <div class="connection-status" id="connectionStatus">
                <div class="status-indicator connected" id="statusIndicator"></div>
                <span class="status-text" id="statusText">Chat-Modus bereit</span>
            </div>

            <!-- Fullscreen Button -->
            <div class="fullscreen-btn" id="fullscreenBtn" title="Vollbild umschalten">
                <i class="fas fa-expand"></i>
            </div>

            <!-- Character Area -->
            <div class="character-area">
                <!-- Agent Speech Bubble (Above Character) -->
                <div class="agent-speech-bubble" id="agentSpeechBubble" style="display: none;">
                    <div class="speech-bubble agent-bubble">
                        <div class="bubble-content">
                            <div class="bubble-icon">
                                <i class="fas fa-quote-left"></i>
                            </div>
                            <div class="bubble-text" id="agentText"></div>
                        </div>
                    </div>
                </div>
                
                <div class="character-container">
                    <!-- Character image/animation -->
                    <div class="character-placeholder" id="characterPlaceholder">
                        <canvas id="riveCanvas"></canvas>
                    </div>
                </div>
            </div>


            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <p>Beginnen Sie zu chatten mit Ihrem KI-Assistenten</p>
            </div>
        </div>

        <!-- Bottom Chat Interface -->
        <div class="bottom-chat-interface" id="bottomChatInterface">
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Geben Sie Ihre Nachricht ein..." maxlength="500" />
                <button class="send-btn" id="sendBtn" title="Nachricht senden" disabled>
                    <img src="/static/images/send.png" alt="Senden" />
                </button>
                <button class="voice-mode-btn" id="voiceModeBtn" title="Zum Sprachmodus wechseln">
                    <img src="/static/images/voice.png" alt="Sprachmodus" />
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Verarbeitung...</p>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="error-modal" id="errorModal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="error-modal-content">
            <div class="error-header">
                <h3>Error</h3>
                <button class="close-btn" id="closeErrorModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="error-body">
                <p id="errorMessage">An error occurred. Please try again.</p>
            </div>
            <div class="error-footer">
                <button class="retry-btn" id="retryBtn">
                    <i class="fas fa-redo"></i>
                    <span>Wiederholen</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@rive-app/canvas@2.7.3/rive.js"></script>
    <script src="/static/chat/script.js"></script>
</body>
</html>
