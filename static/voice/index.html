<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <link rel="stylesheet" href="/static/voice/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Left Control Panel -->
        <div class="left-controls" id="leftControls">
            <button class="control-btn mic-btn" id="micBtn" title="Toggle Microphone">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="control-btn speaker-btn" id="speakerBtn" title="Toggle Speaker">
                <i class="fas fa-volume-up"></i>
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="main-area">
            <!-- Connection Status (Top) -->
            <div class="connection-status" id="connectionStatus">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="statusText">Initializing...</span>
            </div>

            <!-- Agent Speech Bubble (Above Character) -->
            <div class="agent-speech-bubble" id="agentSpeechBubble" style="display: none;">
                <div class="speech-bubble agent-bubble">
                    <div class="bubble-content">
                        <div class="bubble-icon">
                            <i class="fas fa-quote-left"></i>
                        </div>
                        <div class="bubble-text" id="agentText"></div>
                    </div>
                </div>
            </div>

            <!-- Character Area -->
            <div class="character-area">
                <div class="character-container">
                    <!-- Character image/animation -->
                    <div class="character-placeholder" id="characterPlaceholder">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjMwMCIgdmlld0JveD0iMCAwIDMwMCAzMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIiByeD0iMTUwIiBmaWxsPSIjRkZBNTAwIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8Y2lyY2xlIGN4PSIxNTAiIGN5PSIxNTAiIHI9IjEwMCIgZmlsbD0iI0ZGQTUwMCIgZmlsbC1vcGFjaXR5PSIwLjMiLz4KPHN2ZyB4PSI4NSIgeT0iODAiIHdpZHRoPSIxMzAiIGhlaWdodD0iMTQwIiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9IiNGRkE1MDAiPgo8cGF0aCBkPSJNMTIgMTJjMi4yMSAwIDQtMS43OSA0LTRzLTEuNzktNC00LTQtNCAxLjc5LTQgNCAxLjc5IDQgNCA0em0wIDJjLTIuNjcgMC04IDEuMzQtOCA0djJoMTZ2LTJjMC0yLjY2LTUuMzMtNC04LTR6Ii8+Cjwvc3ZnPgo8L3N2Zz4K" alt="AI Assistant Character" id="characterImage" />
                    </div>
                    
                    <!-- Agent Speaking Indicator -->
                    <div class="speaking-indicator agent-indicator" id="agentIndicator">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                    </div>
                </div>
            </div>

            <!-- User Input Bubble (Below Character) -->
            <div class="user-input-bubble" id="userInputBubble" style="display: none;">
                <div class="speech-bubble user-bubble">
                    <div class="bubble-content">
                        <div class="bubble-text" id="userText"></div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <i class="fas fa-microphone"></i>
                </div>
                <p>Start speaking to your AI assistant</p>
            </div>
        </div>

        <!-- Floating Text Input Button -->
        <div class="floating-text-btn" id="floatingTextBtn" title="Send Text Message">
            <i class="fas fa-keyboard"></i>
        </div>

        <!-- Back to Chat Button -->
        <div class="back-to-chat-btn" id="backToChatBtn" title="Back to Chat Mode">
            <i class="fas fa-arrow-left"></i>
        </div>

        <!-- Hidden Elements for Audio Analysis -->
        <div class="hidden-elements">
            <!-- User Speaking Indicator -->
            <div class="user-indicator" id="userIndicator">
                <div class="audio-level" id="userAudioLevel"></div>
            </div>
            
            <!-- Agent Audio Level -->
            <div class="agent-audio-level" id="agentAudioLevel"></div>
            
            <!-- Room Info -->
            <div class="room-info" id="roomInfo">
                <span class="room-id" id="roomId">-</span>
            </div>
            
            <!-- Legacy Elements for Compatibility -->
            <div id="userTranscription" style="display: none;"></div>
            <div id="agentTranscription" style="display: none;"></div>
        </div>
    </div>

    <!-- Text Input Modal -->
    <div class="text-input-modal" id="textInputModal" style="display: none;">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="input-modal-content">
            <div class="input-header">
                <h3>Send Text Message</h3>
                <button class="close-input-btn" id="closeInputBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="input-body">
                <textarea id="textInput" placeholder="Type your message..." maxlength="500"></textarea>
            </div>
            <div class="input-footer">
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span>Send</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Connecting to AI Assistant...</p>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="error-modal" id="errorModal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="error-modal-content">
            <div class="error-header">
                <h3>Connection Error</h3>
                <button class="close-btn" id="closeErrorModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="error-body">
                <p id="errorMessage">Unable to connect to the AI assistant. Please check your internet connection and try again.</p>
            </div>
            <div class="error-footer">
                <button class="retry-btn" id="retryBtn">
                    <i class="fas fa-redo"></i>
                    <span>Retry Connection</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="/static/voice/script.js"></script>
</body>
</html>
