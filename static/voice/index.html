<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-Sprachassistent</title>
    <link rel="stylesheet" href="/static/voice/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Main Content Area -->
        <div class="main-area">
            <!-- Connection Status (Top) -->
            <div class="connection-status" id="connectionStatus">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="statusText">Initialisierung...</span>
            </div>

            <!-- Character Area -->
            <div class="character-area">
                <!-- Agent Speech Bubble (Above Character) -->
                <div class="agent-speech-bubble" id="agentSpeechBubble" style="display: none;">
                    <div class="speech-bubble agent-bubble">
                        <div class="bubble-content">
                            <div class="bubble-text" id="agentText"></div>
                        </div>
                    </div>
                </div>
                
                <div class="character-container">
                    <!-- Character image/animation -->
                    <div class="character-placeholder" id="characterPlaceholder">
                        <canvas id="riveCanvas"></canvas>
                    </div>
                    
                    <!-- Agent Speaking Indicator -->
                    <div class="speaking-indicator agent-indicator" id="agentIndicator">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <i class="fas fa-microphone"></i>
                </div>
                <p>Sprechen Sie mit Ihrem KI-Assistenten</p>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            <button class="control-btn mic-btn" id="micBtn" title="Mikrofon umschalten">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="control-btn back-btn" id="backToChatBtn" title="Zurück zum Chat-Modus">
                <img src="/static/images/back.png" alt="Zurück" style="width: 32px; height: 32px;" />
            </button>
        </div>

        <!-- Fullscreen Button -->
        <div class="fullscreen-btn" id="fullscreenBtn" title="Vollbild umschalten">
            <i class="fas fa-expand"></i>
        </div>

        <!-- Hidden Elements for Audio Analysis -->
        <div class="hidden-elements">
            <!-- User Speaking Indicator -->
            <div class="user-indicator" id="userIndicator">
                <div class="audio-level" id="userAudioLevel"></div>
            </div>
            
            <!-- Agent Audio Level -->
            <div class="agent-audio-level" id="agentAudioLevel"></div>
            
            <!-- Room Info -->
            <div class="room-info" id="roomInfo">
                <span class="room-id" id="roomId">-</span>
            </div>
            
            <!-- Legacy Elements for Compatibility -->
            <div id="userTranscription" style="display: none;"></div>
            <div id="agentTranscription" style="display: none;"></div>
        </div>
    </div>


    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Verbindung zum KI-Assistenten...</p>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="error-modal" id="errorModal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="error-modal-content">
            <div class="error-header">
                <h3>Connection Error</h3>
                <button class="close-btn" id="closeErrorModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="error-body">
                <p id="errorMessage">Unable to connect to the AI assistant. Please check your internet connection and try again.</p>
            </div>
            <div class="error-footer">
                <button class="retry-btn" id="retryBtn">
                    <i class="fas fa-redo"></i>
                    <span>Verbindung wiederholen</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="https://unpkg.com/@rive-app/canvas@2.7.3/rive.js"></script>
    <script src="/static/voice/script.js"></script>
</body>
</html>
